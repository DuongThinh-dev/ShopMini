<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi — ShopMini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-modern sticky-top">
        <div class="container gap-3">
            <a class="navbar-brand brand-logo" href="../index.html">
                <span class="brand-icon"><i class="fa-solid fa-bag-shopping"></i></span>
                <span>Shop<span class="text-primary">Mini</span></span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse flex-grow-0" id="mainNav">
                <ul class="navbar-nav align-items-lg-center gap-lg-2 mt-3 mt-lg-0">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="../index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="products.html">Sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold active text-primary" href="orders.html">Đơn hàng</a></li>
                    <li class="nav-item">
                        <a class="btn btn-light position-relative rounded-pill px-3 fw-semibold" href="cart.html">
                            <i class="fa-solid fa-cart-shopping text-primary me-1"></i> Giỏ hàng
                            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2" id="auth-nav-slot"></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Lịch sử đơn hàng của tôi</h3>
                <p class="text-muted small mb-0">Theo dõi tiến trình xử lý, thanh toán QR Demo hoặc hủy đơn hàng khi chưa giao</p>
            </div>
            <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="loadUserOrders()">
                <i class="fa-solid fa-rotate me-1"></i> Làm mới
            </button>
        </div>

        <div id="orders-list-container" class="d-grid gap-4">
            <div class="skeleton-box" style="height: 220px;"></div>
        </div>
    </main>

    <!-- Modal QR Thanh Toán Demo -->
    <div class="modal fade" id="orderQrModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-qrcode text-primary me-2"></i>Quét mã QR thanh toán (Demo)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center pt-2">
                    <p class="text-muted small mb-3">Quét mã QR mô phỏng để hoàn tất thanh toán đơn hàng</p>
                    <div class="d-inline-block p-2 bg-light rounded-4 border mb-3">
                        <img id="order-qr-image" src="" alt="QR Demo" style="width: 220px; height: 245px;">
                    </div>
                    <div class="bg-light rounded-3 p-3 text-start small">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Số tiền:</span>
                            <strong id="order-qr-amount" class="text-danger fs-6">0 ₫</strong>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Nội dung CK:</span>
                            <code id="order-qr-note" class="fw-bold">SHOPMINI</code>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" id="btn-order-qr-confirm" class="btn btn-success fw-bold px-4" onclick="confirmOrderQrPaid()">
                        <i class="fa-solid fa-circle-check me-1"></i> Xác nhận đã chuyển khoản
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
                const ORDER_STEPS = [
                    { key: 'PendingConfirmation', label: 'Chờ xác nhận' },
                    { key: 'Confirmed', label: 'Đã xác nhận' },
                    { key: 'Shipping', label: 'Đang giao hàng' },
                    { key: 'Completed', label: 'Hoàn thành' }
                ];
                const CANCELLABLE_STATES = ['PendingPayment', 'PendingConfirmation', 'Confirmed'];
                let activeQrTarget = null;

                let currentOrdersCache = [];

                document.addEventListener('DOMContentLoaded', async () => {
                    if (auth.requireAuth()) {
                        await loadUserOrders();
                        const params = new URLSearchParams(window.location.search);
                        const autoPayOrderId = params.get('payNow');
                        if (autoPayOrderId && currentOrdersCache.length > 0) {
                            const target = currentOrdersCache.find(o => o.orderId === autoPayOrderId);
                            if (target && target.payment && target.payment.status !== 'Paid') {
                                setTimeout(() => {
                                    openOrderQrModal(target.payment.paymentId, target.orderId, target.status, target.totalAmount);
                                }, 300);
                            }
                        }
                    }
                });

                async function loadUserOrders() {
                    const user = auth.getCurrentUser();
                    const container = document.getElementById('orders-list-container');
                    if (!user || !container) return;

                    try {
                        const orders = await api.getOrdersByUser(user.userId);
                        if (!orders || orders.length === 0) {
                            currentOrdersCache = [];
                            container.innerHTML = `
                                <div class="card border-0 shadow-sm rounded-4 text-center py-5">
                                    <i class="fa-solid fa-receipt fa-3x text-muted mb-3"></i>
                                    <h5 class="fw-bold">Bạn chưa có đơn hàng nào</h5>
                                    <p class="text-muted small mb-3">Hãy chọn sản phẩm yêu thích và đặt đơn hàng đầu tiên ngay!</p>
                                    <div><a href="products.html" class="btn btn-primary-modern px-4">Mua sắm ngay</a></div>
                                </div>
                            `;
                            return;
                        }

                        const ordersWithPayment = await Promise.all(orders.map(async (order) => {
                            let payment = null;
                            try {
                                payment = await api.getPaymentByOrder(order.orderId);
                            } catch {
                                payment = null;
                            }
                            return { ...order, payment };
                        }));

                        currentOrdersCache = ordersWithPayment;
                        container.innerHTML = ordersWithPayment.map(renderOrderCard).join('');
                    } catch (err) {
                        container.innerHTML = `<div class="alert alert-danger rounded-4">Lỗi tải đơn hàng: ${err.message}</div>`;
                    }
                }

                function renderOrderCard(order) {
                    const status = order.status || 'PendingConfirmation';
                    const isCancelled = status === 'Cancelled' || status === 'PaymentFailed';
                    const canCancel = CANCELLABLE_STATES.includes(status);
                    const payment = order.payment;
                    const payMethod = payment?.method || payment?.paymentMethod || 'COD';
                    const payStatus = payment?.status || 'Unpaid';
                    const canSimulatePay = payment && payMethod === 'Simulation' && (payStatus === 'Unpaid' || payStatus === 'Pending') && !isCancelled;

                    const activeIdx = ORDER_STEPS.findIndex(s => s.key === status);
                    const stepperHtml = isCancelled
                        ? `<div class="alert alert-danger py-2 px-3 rounded-3 small fw-semibold my-3">
                               <i class="fa-solid fa-ban me-2"></i>Đơn hàng đã hủy (${status})
                           </div>`
                        : `<div class="order-stepper">
                               ${ORDER_STEPS.map((step, idx) => {
                                   const stateClass = idx < activeIdx ? 'completed' : (idx === activeIdx ? 'active' : '');
                                   return `
                                       <div class="step-item ${stateClass}">
                                           <div class="step-dot">${idx < activeIdx ? '<i class="fa-solid fa-check"></i>' : idx + 1}</div>
                                           <div class="small fw-semibold">${step.label}</div>
                                       </div>
                                   `;
                               }).join('')}
                           </div>`;

                    const items = order.orderItems || order.items || [];

                    return `
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pb-3 border-bottom">
                                <div>
                                    <span class="text-muted small">Mã đơn:</span>
                                    <code class="fw-bold text-dark ms-1">${order.orderId}</code>
                                    <span class="badge bg-primary-subtle text-primary ms-2">${status}</span>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-light text-dark border">
                                        <i class="fa-solid fa-qrcode text-primary me-1"></i>${payMethod === 'Simulation' ? 'QR Demo' : payMethod}
                                    </span>
                                    <span class="badge ${payStatus === 'Paid' ? 'bg-success' : 'bg-warning text-dark'}">
                                        ${payStatus === 'Paid' ? 'Đã thanh toán' : 'Chưa thanh toán'}
                                    </span>
                                </div>
                            </div>

                            ${stepperHtml}

                            <div class="bg-light rounded-3 p-3 mb-3">
                                ${items.map(i => `
                                    <div class="d-flex justify-content-between align-items-center py-1 small">
                                        <div>
                                            <span class="fw-bold">${i.productName}</span>
                                            <span class="text-muted ms-2">x${i.quantity}</span>
                                        </div>
                                        <span class="fw-semibold">${formatCurrency(i.subtotal || (i.unitPrice * i.quantity))}</span>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                                <div class="small text-muted">
                                    <i class="fa-solid fa-location-dot text-primary me-1"></i>
                                    <strong>${order.receiverName}</strong> (${order.phone}) — ${order.shippingAddress}
                                </div>
                                <div class="d-flex align-items-center gap-2 ms-auto">
                                    <span class="me-2">Tổng tiền: <strong class="fs-5 text-primary">${formatCurrency(order.totalAmount)}</strong></span>
                                    ${canSimulatePay ? `
                                        <button class="btn btn-success btn-sm rounded-pill px-3 fw-semibold" onclick="openOrderQrModal('${payment.paymentId}', '${order.orderId}', '${status}', ${order.totalAmount})">
                                            <i class="fa-solid fa-qrcode me-1"></i>Thanh toán QR
                                        </button>
                                    ` : ''}
                                    ${canCancel ? `
                                        <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="handleCancelOrder('${order.orderId}')">
                                            <i class="fa-solid fa-xmark me-1"></i>Hủy đơn hàng
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                function openOrderQrModal(paymentId, orderId, currentOrderStatus, amount) {
                    const shortCode = String(orderId).slice(0, 8).toUpperCase();
                    activeQrTarget = { paymentId, orderId, currentOrderStatus };
                    document.getElementById('order-qr-image').src = generateDemoQrDataUrl(shortCode, amount);
                    document.getElementById('order-qr-amount').textContent = formatCurrency(amount);
                    document.getElementById('order-qr-note').textContent = `SHOPMINI ${shortCode}`;
                    new bootstrap.Modal(document.getElementById('orderQrModal')).show();
                }

                async function confirmOrderQrPaid() {
                    if (!activeQrTarget) return;
                    const btn = document.getElementById('btn-order-qr-confirm');
                    btn.disabled = true;

                    try {
                        const txnCode = `QR-DEMO-${Date.now()}`;
                        await api.updatePaymentStatus(activeQrTarget.paymentId, 'Paid', txnCode);
                        if (activeQrTarget.currentOrderStatus === 'PendingPayment') {
                            await api.updateOrderStatus(activeQrTarget.orderId, 'PendingConfirmation');
                        }
                        bootstrap.Modal.getInstance(document.getElementById('orderQrModal'))?.hide();
                        showToast(`Thanh toán QR thành công! Mã GD: ${txnCode}`, 'success');
                        await loadUserOrders();
                    } catch (err) {
                        showToast(err.message || 'Lỗi xác nhận thanh toán QR', 'danger');
                    } finally {
                        btn.disabled = false;
                    }
                }

                async function handleCancelOrder(orderId) {
                    const user = auth.getCurrentUser();
                    if (!user) return;
                    if (!confirm('Bạn có chắc chắn muốn hủy đơn hàng này không?')) return;

                    try {
                        await api.cancelOrder(orderId, user.userId);
                        showToast('Đã hủy đơn hàng thành công', 'info');
                        await loadUserOrders();
                    } catch (err) {
                        showToast(err.message || 'Không thể hủy đơn hàng', 'danger');
                    }
                }
    </script>
</body>
</html>
